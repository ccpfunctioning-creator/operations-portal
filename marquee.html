<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .marquee-container {
      display: flex;
      align-items: center;
      height: 100vh; /* Forces the text vertically center */
      font-family: sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="marquee-container">
    <marquee scrollamount="6">⚠️ Your Scrolling Text Message Goes Here!</marquee>
  </div>
</body>
</html>
